in:35px auto;max-width:490px;padding:22px;text-align:center;border:1px solid #653e50;border-radius:12px;background:#17121b}.private-error h2{color:#ff91a3;font:800 25px var(--display)}.private-error p{color:#abb7c4;line-height:1.5}.private-hidden{margin:30px 0;padding:27px 15px;text-align:center;border:1px solid #35495b;border-radius:12px;background:#111a25}.private-hidden .icon{font-size:40px;color:var(--cyan)}.private-hidden p{margin:8px 0 16px;color:#9eacbd}.private-reveal{margin-top:8px}.private-warning{margin:12px 0 0;color:#77889b;font:10px/1.45 var(--ui)}@media(max-width:620px){.qr-code-link{width:112px;height:112px}.qr-code-link img,.qr-code-link canvas{width:104px!important;height:104px!important}.qr-panel{padding:10px}.private-screen{padding:12px}.private-grid{gap:7px}.private-card{min-height:163px;padding:11px 7px 8px}.private-intel .private-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:540px){.private-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

<body>
<div class="noise" aria-hidden="true"></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" referrerpolicy="no-referrer"></script>
<script>
(()=>{
'use strict';
const SLUGS=[
 {id:'thunderbolt',name:'Громобой',color:'#e5d028',symbol:'ГР',type:'Прямая атака',desc:'Мощный прямой удар без дополнительных эффектов.',stat:'4 УРОНА'},
 {id:'frostfang',name:'Ледоклык',color:'#29b6f6',symbol:'ЛК',type:'Контроль',desc:'Наносит 1 урон. При провале проверки замораживает выбранную ячейку врага до конца раунда.',stat:'1 УРОН · ЗАМОРОЗКА'},
 {id:'flameslinger',name:'Огнеслаг',color:'#e53935',symbol:'ОГ',type:'Атака с эффектом',desc:'Наносит 3 урона. При провале проверки накладывает Ожог: 1 урон в конце двух ходов.',stat:'3 УРОНА · ОЖОГ'},
 {id:'toxin',name:'Токсин',color:'#2e7d32',symbol:'ТК',type:'Атака с эффектом',desc:'Наносит 2 урона. При провале проверки накладывает Яд на 2 хода: атаки слабее на 1.',stat:'2 УРОНА · ЯД'},
 {id:'lightwing',name:'Док',color:'#81c784',symbol:'ДК',type:'Поддержка · себе',desc:'Восстанавливает 3 ОЗ и снимает с вас Ожог и Яд.',stat:'+3 ОЗ · ОЧИЩЕНИЕ'},
 {id:'mindspook',name:'Гипно',color:'#fff176',symbol:'ГП',type:'Контроль разума',desc:'Выберите ячейку врага. При провале проверки раскрывает и обращает слаг из неё против владельца.',stat:'КОНТРОЛЬ'},
 {id:'lightbug',name:'Светляк',color:'#eeff41',symbol:'СВ',type:'Разведка',desc:'Наносит 1 урон и раскрывает вам 2 выбранные ячейки врага до конца раунда.',stat:'1 УРОН · РАЗВЕДКА'},
 {id:'stoneshield',name:'Шилд',color:'#8a9098',symbol:'ШЛ',type:'Защита · гибрид',desc:'Даёт вам щит на 3 ОЗ. Если проверка врага показывает 1 или 2, он также получает 1 урон.',stat:'ЩИТ 3 ОЗ'},
 {id:'detonator',name:'Бабах',color:'#82916f',symbol:'ББ',type:'Нестабильная атака',desc:'Бросьте d6: на 1 слаг взрывается у вас в руках и наносит вам 1 урон; на 2–6 наносит столько урона врагу.',stat:'1–6 УРОНА'},
 {id:'acidic',name:'Кислотник',color:'#76ff03',symbol:'КС',type:'Завершающий удар',desc:'Наносит 5 урона врагу с Ожогом или Ядом; иначе наносит 2.',stat:'2 / 5 УРОНА'},
 {id:'vampire',name:'Арахно',color:'#b55be0',symbol:'АР',type:'Вампирическая атака',desc:'Наносит 2 урона и даёт вам Регенерацию на 2 хода (+1 ОЗ в конце хода).',stat:'2 УРОНА · РЕГЕНЕРАЦИЯ'}
];
const $=s=>document.querySelector(s), app=$('#app');
const slugBy=id=>SLUGS.find(s=>s.id===id);
const cardArt=(slug,large=false)=>`assets/cards/${slug.id}${large?'-large':''}.jpg`;
const cardBack='assets/cards/back.jpg';
const fresh=()=>({screen:'setup',setupStep:0,handoff:false,names:['Игрок 1','Игрок 2'],picks:[[],[]],players:[],round:0,active:null,pending:null,neutralShield:0,initiative:[null,null],log:[],busy:false,winner:null,privateDeck:null,privateHidden:false});
let G=fresh();
const PAGES_BASE_KEY='slugterraPagesBase';
let PAGES_BASE_OVERRIDE='';
function normalizePagesBase(raw){const u=new URL(String(raw||'').trim());if(u.protocol!=='https:')throw new Error('Нужен HTTPS-адрес опубликованного сайта.');u.search='';u.hash='';if(/\/[^/]+\.html?$/i.test(u.pathname))u.pathname=u.pathname.replace(/[^/]+\.html?$/i,'');if(!u.pathname.endsWith('/'))u.pathname+='/';return u.toString();}
function detectedPagesBase(){if(location.protocol==='https:'&&/(^|\.)github\.io$/i.test(location.hostname)){let path=location.pathname;if(/\/[^/]+\.html?$/i.test(path))path=path.replace(/[^/]+\.html?$/i,'');if(!path.endsWith('/'))path+='/';return `${location.origin}${path}`;}return '';}
function getPagesBase(){const detected=detectedPagesBase();if(detected)return detected;if(PAGES_BASE_OVERRIDE)return PAGES_BASE_OVERRIDE;try{return normalizePagesBase(localStorage.getItem(PAGES_BASE_KEY)||'');}catch{return '';}}
function parseSlotMap(raw,exactSix){if(!raw)throw new Error('В QR-ссылке нет порядка колоды.');const out=[],indices=new Set();for(const item of raw.split(',')){const m=item.match(/^([0-5])-([a-z0-9]+)$/i);if(!m)throw new Error('В QR-ссылке повреждён порядок слотов.');const index=Number(m[1]),slug=slugBy(m[2]);if(!slug||indices.has(index))throw new Error('В QR-ссылке есть неизвестный или повторный слот.');indices.add(index);out.push({index,slug:slug.id});}if(exactSix&&out.length!==6)throw new Error('В QR-ссылке должно быть ровно шесть карт.');return out.sort((a,b)=>a.index-b.index);}
function readPrivateRequest(){const q=new URLSearchParams(location.search);if(!q.has('p')&&!q.has('slots'))return null;try{const p=q.get('p');if(p!=='1'&&p!=='2')throw new Error('В QR-ссылке не указан номер игрока.');const slots=parseSlotMap(q.get('slots'),true);if(new Set(slots.map(x=>x.slug)).size!==6)throw new Error('В колоде обнаружены повторные карты.');const intel=q.get('r')?parseSlotMap(q.get('r'),false):[];return{player:Number(p)-1,slots,intel};}catch(error){return{error:error.message||'Не удалось прочитать QR-ссылку.'};}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const ruTurns=n=>`${n} ${n===1?'ход':n>=2&&n<=4?'хода':'ходов'}`;
const ruSlugs=n=>`${n} ${n%100>=11&&n%100<=14?'слагов':n%10===1?'слаг':n%10>=2&&n%10<=4?'слага':'слагов'}`;
const rand=()=>Math.floor(Math.random()*6)+1;
const player=id=>G.players[id];
const opposite=id=>1-id;
const playerName=id=>player(id)?.name||G.names[id];
const available=p=>p.slots.map((s,i)=>s.state==='down'?i:-1).filter(i=>i>=0);
const log=(message,type='')=>{G.log.push({message,type,round:G.round});if(G.log.length>100)G.log.shift();syncLog();};
function syncLog(){const list=$('#loglist');if(!list)return;list.innerHTML=G.log.length?G.log.map((e,i)=>`<div class="logitem ${e.type}"><span class="logtime">Р${String(e.round).padStart(2,'0')} · ${String(i+1).padStart(3,'0')}</span>${e.message}</div>`).join(''):`<div class="logempty">Арена пока затихла.<br>Здесь появятся броски и действия слагов.</div>`;const count=$('#logcount');if(count)count.textContent=String(G.log.length).padStart(2,'0');list.scrollTop=list.scrollHeight;}
function choiceMarkup(slug,selected){const chosen=selected.includes(slug.id);return `<div class="choice-item" style="--slug:${slug.color}"><button type="button" class="slug-choice ${chosen?'selected':''}" data-pick="${slug.id}" aria-label="${chosen?'Убрать из колоды':'Добавить в колоду'}: ${esc(slug.name)}" aria-pressed="${chosen}"><span class="choice-art"><img data-art src="${cardArt(slug)}" alt="Карточка ${esc(slug.name)}" width="480" height="679" loading="lazy" decoding="async"></span><span class="choice-caption"><span class="choice-name">${slug.name}</span><span class="choice-check" aria-hidden="true">${chosen?'✓':'+'}</span></span></button><button type="button" class="card-detail" data-card="${slug.id}" aria-label="Рассмотреть карту ${esc(slug.name)}">РАССМОТРЕТЬ КАРТУ ↗</button></div>`;}
function bindCardDetails(scope=app){scope.querySelectorAll('[data-card]').forEach(button=>button.onclick=()=>showCardDetail(button.dataset.card));scope.querySelectorAll('img[data-art]').forEach(img=>{img.onerror=()=>{img.onerror=null;img.style.display='none';const message=document.createElement('span');message.className='art-unavailable';message.textContent='Карточка не загрузилась. Проверьте папку assets/cards.';img.parentElement.appendChild(message);};});}
function showCardDetail(id){const slug=slugBy(id);if(!slug||$('#cardViewer'))return;const focusBefore=document.activeElement,overflowBefore=document.body.style.overflow,layer=document.createElement('div');layer.id='cardViewer';layer.className='card-viewer';layer.style.setProperty('--slug',slug.color);layer.innerHTML=`<section class="card-viewer-box" role="dialog" aria-modal="true" aria-labelledby="cardViewerTitle"><button type="button" class="card-viewer-close" aria-label="Закрыть просмотр">✕</button><img class="card-viewer-art" data-art src="${cardArt(slug,true)}" alt="Карточка ${esc(slug.name)}" width="1000" height="1415" decoding="async"><div class="card-viewer-copy"><div class="eyebrow">КАРТОЧКА СЛАГА</div><h2 id="cardViewerTitle">${slug.name}</h2><div class="card-viewer-type">${slug.type}</div><div class="card-viewer-stat">${slug.stat}</div><p>${slug.desc}</p><p class="card-viewer-hint">ESC — ЗАКРЫТЬ ПРОСМОТР</p></div></section>`;const close=()=>{layer.remove();document.body.style.overflow=overflowBefore;document.removeEventListener('keydown',onKey);if(focusBefore?.isConnected)focusBefore.focus();};const closeButton=layer.querySelector('.card-viewer-close');const onKey=e=>{if(e.key==='Escape'){e.preventDefault();close();}else if(e.key==='Tab'){e.preventDefault();closeButton.focus();}};closeButton.onclick=close;layer.onclick=e=>{if(e.target===layer)close();};document.body.appendChild(layer);document.body.style.overflow='hidden';bindCardDetails(layer);document.addEventListener('keydown',onKey);closeButton.focus();}
function renderTop(){return `<div class="topline"><div class="brandline"><div class="brandmark">✦</div><div class="brandname">СЛАГТЕРРА <span>ДУЭЛИ</span><small class="version">ВЕРСИЯ 1 · ФИНАЛЬНЫЙ РЕБАЛАНС</small></div></div><div class="topright"><span class="status-dot"></span> АРЕНА ГОТОВА</div></div>`;}
function renderSetup(){
 if(G.handoff){app.innerHTML=`<main class="screen">${renderTop()}<section class="handoff"><div class="icon">⇄</div><div class="eyebrow">ЛОКАЛЬНАЯ ИГРА · ПЕРЕДАЙТЕ УСТРОЙСТВО</div><h2>ИГРОК 2, ТВОЯ КОЛОДА</h2><p>${esc(G.names[0])} собрал шесть слагов. Передайте устройство ${esc(G.names[1])}: первая колода останется скрытой.</p><button class="primary" id="handoffGo">СОБРАТЬ КОЛОДУ ИГРОКА 2&nbsp; →</button></section></main>`;$('#handoffGo').onclick=()=>{G.handoff=false;G.setupStep=1;renderSetup();};return;}
 const ix=G.setupStep,selected=G.picks[ix],isFull=selected.length===6;
 app.innerHTML=`<main class="screen">${renderTop()}<section class="setup"><header class="setuphead"><div class="eyebrow">2 ИГРОКА · ЛОКАЛЬНАЯ ДУЭЛЬ</div><h1>Собери свою <em>колоду</em></h1><p>Выберите шесть разных слагов. Перед раундом карты перемешиваются по ячейкам: обе расстановки на общей арене скрыты, свою колоду смотрите по личному QR-коду.</p></header><div class="build-panel"><div class="buildtop"><div class="stepbadge"><div class="stepno">0${ix+1}</div><div class="steptext"><strong>ИГРОК ${ix+1} · КОЛОДА</strong><small>Шесть разных слагов · без повторов</small></div></div><div class="counter"><b class="${isFull?'full':''}">${selected.length}</b> / 6 ВЫБРАНО</div><div class="player-fields"><label>ИМЯ ИГРОКА<input id="playerName" maxlength="18" value="${esc(G.names[ix])}" autocomplete="off"></label></div></div><div class="build-grid">${SLUGS.map(s=>choiceMarkup(s,selected)).join('')}</div><div class="buildfoot"><span class="hint">${isFull?'Колода готова. Можно выходить на арену.':`Осталось выбрать: ${ruSlugs(6-selected.length)}.`}</span><button id="buildNext" class="primary" ${isFull?'':'disabled'}>${ix===0?'ЗАФИКСИРОВАТЬ КОЛОДУ И ПЕРЕДАТЬ УСТРОЙСТВО':'НАЧАТЬ ДУЭЛЬ'}&nbsp; →</button></div></div></section></main>`;
 bindCardDetails();$('.setuphead p').textContent='Выберите шесть разных слагов. Перед раундом карты перемешиваются по ячейкам: обе расстановки на общей арене скрыты, свою колоду смотрите по личному QR-коду.';$('#playerName').addEventListener('input',e=>{G.names[ix]=e.target.value.trim()||`Игрок ${ix+1}`;});
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const id=b.dataset.pick,arr=G.picks[ix];if(arr.includes(id))G.picks[ix]=arr.filter(x=>x!==id);else if(arr.length<6)arr.push(id);renderSetup();});
 $('#buildNext').onclick=()=>{if(G.picks[ix].length!==6)return;if(ix===0){G.handoff=true;renderSetup();}else startMatch();};
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startMatch(){G.screen='game';G.players=G.picks.map((deck,i)=>({id:i,name:G.names[i],hp:20,effects:{burn:0,poison:0,regen:0,shield:0},slots:[],deck:[...deck]}));G.round=0;G.active=null;G.pending=null;G.neutralShield=0;G.log=[];G.busy=false;G.winner=null;log('Дуэль началась. У каждого игрока 20 ОЗ и шесть разных слагов.','note');renderGame();beginRound();}
function statusTags(p){const e=p.effects,out=[];if(e.burn)out.push(`<span class="effect burn"><i class="dot"></i>ОЖОГ ${e.burn} х.</span>`);if(e.poison)out.push(`<span class="effect poison"><i class="dot"></i>ЯД ${e.poison} х.</span>`);if(e.regen)out.push(`<span class="effect regen"><i class="dot"></i>РЕГЕН ${e.regen} х.</span>`);if(e.shield)out.push(`<span class="effect shield"><i class="dot"></i>ЩИТ ${e.shield}/3</span>`);return out.join('');}
function slotIsSelectable(owner,index){if(G.busy)return false;const sl=player(owner).slots[index],pending=G.pending;if(!pending)return owner===G.active&&sl.state==='down';if(pending.chooser!==G.active)return false;if(pending.kind==='freezeSlot')return owner===pending.targetSide&&sl.state==='down';if(pending.kind==='revealTwo')return owner===pending.targetSide&&sl.state==='down'&&!sl.revealedTo.includes(pending.chooser);if(pending.kind==='mindspookTarget'||pending.kind==='frostTarget')return owner===pending.targetSide&&sl.state==='down';return false;}
function slotView(owner,index,viewer){const slot=player(owner).slots[index],used=slot.state==='used',selectable=slotIsSelectable(owner,index),slug=used?slugBy(slot.slug):null;
 const control=used?`data-card="${slug.id}" aria-label="Рассмотреть использованную карту ${esc(slug.name)}"`:`data-owner="${owner}" data-slot="${index}" aria-label="${owner===G.active&&!G.pending?'Активировать слаг':'Выбрать ячейку'} ${index+1}" ${selectable?'':'disabled'}`;
 const status=used?`${slug.name} · ИСПОЛЬЗОВАНА`:slot.state==='frozen'?'ЗАМОРОЖЕНА · ДО КОНЦА РАУНДА':selectable?'ВЫБРАТЬ ЯЧЕЙКУ':'СКРЫТАЯ КАРТА';
 return `<button type="button" class="slot ${slot.state} ${selectable?'selectable':''}" ${control}><span class="slot-idx">ЯЧЕЙКА 0${index+1}</span><span class="card-surface"><img class="card-image" data-art src="${used?cardArt(slug):cardBack}" alt="${used?esc(slug.name):'Закрытая карта — рубашка'}" width="480" height="679" decoding="async">${slot.state==='frozen'?'<span class="frozen-screen" aria-hidden="true">❄<small>ЗАМОРОЖЕНА</small></span>':''}${!used&&slot.revealedTo.length?'<span class="scouted-marker" title="Ячейка разведана; сведения в личном HUD">◉</span>':''}</span><span class="slot-status">${status}</span></button>`;}
function effectsMarkup(p){return statusTags(p)||'<span class="effect" style="color:#77889b">НЕТ ЭФФЕКТОВ</span>';}
function duelistMarkup(id,viewer,position){const p=player(id),active=G.active===id&&!G.pending,hp=Math.max(0,p.hp),healthClass=hp<=6?'low':hp<=11?'mid':'';const initiativeWinner=G.initiative[0]===null?null:(G.initiative[0]>G.initiative[1]?0:1);return `<section class="duelist ${position} ${active?'active':''}" style="--side:${id===0?'#43e7f4':'#b67bff'}"><header class="duelist-header"><div class="avatar">${esc(p.name.slice(0,1).toUpperCase())}</div><div class="name-block"><strong>${esc(p.name)}</strong><small>${id===G.active?(G.pending?'ВЫБОР ЦЕЛИ':`ВАШ ХОД · ИГРОК ${id+1}`):(id===initiativeWinner?'ВЫИГРАЛ ИНИЦИАТИВУ':'ДУЭЛИСТ')}</small></div><div class="hpblock"><div class="hp-label"><span>ЗАПАС ЗДОРОВЬЯ</span><b>${hp}<small style="color:#728398;font-size:10px"> / 20 ОЗ</small></b></div><div class="hp-track"><div class="hp-fill ${healthClass}" style="width:${hp/20*100}%"></div></div></div><div class="hud-effects">${effectsMarkup(p)}</div></header><div class="slots">${p.slots.map((_,i)=>slotView(id,i,viewer)).join('')}</div></section>`;}
function promptText(){if(G.pending){switch(G.pending.kind){case'mindspookTarget':return 'ВЫБЕРИТЕ ЯЧЕЙКУ ВРАГА';case'frostTarget':return 'ВЫБЕРИТЕ ЯЧЕЙКУ ДЛЯ ЗАМОРОЗКИ';case'freezeSlot':return G.pending.targetSide===G.active?'ЗАМОРОЗЬТЕ СВОЮ ЯЧЕЙКУ':'ЗАМОРОЗЬТЕ ЯЧЕЙКУ ВРАГА';case'revealTwo':return `РАСКРОЙТЕ ЯЧЕЙКИ ВРАГА · ${G.pending.needed-G.pending.chosen.length}`;}}return G.active===null?'БРОСОК ИНИЦИАТИВЫ':`${playerName(G.active)} · ВЫБЕРИТЕ СЛАГА`;}
function promptSub(){if(G.pending){if(G.pending.kind==='mindspookTarget')return 'Гипно проверит выбранную ячейку; сведения появятся на вашем HUD после повторного сканирования QR.';if(G.pending.kind==='frostTarget')return 'Выберите свободную ячейку. Враг бросит кубик на защиту.';if(G.pending.kind==='freezeSlot')return 'Выберите свободную ячейку — она останется закрытой до конца раунда.';if(G.pending.kind==='revealTwo')return 'После выбора ячеек сканируйте обновлённый QR-код, чтобы увидеть разведку.';}return G.active===null?'Кто выбросит больше на d6, тот ходит первым.':'На арене обе колоды закрыты. Свою расстановку смотрите по личному QR-коду.';}
function attachQrPanel(){const side=$('.sidepanel');if(!side||$('#qrPanel'))return;side.insertAdjacentHTML('afterbegin',`<section class="qr-panel" id="qrPanel"><div class="qr-head">ТАЙНАЯ КОЛОДА <span>· QR HUD</span></div><p class="qr-caption">Каждый игрок сканирует только свой код. На общей арене карты остаются закрытыми.</p><label class="pages-label" for="pagesBase"><span>АДРЕС GITHUB PAGES</span><span class="pages-state" id="pagesState"></span></label><div class="pages-row"><input id="pagesBase" type="url" inputmode="url" placeholder="https://имя.github.io/проект/" autocomplete="url"><button id="savePagesBase" type="button">СОХРАНИТЬ</button></div><div class="qr-grid">${[0,1].map(i=>`<article class="qr-card"><b class="qr-player" id="qrPlayer${i+1}">ИГРОК ${i+1}</b><a class="qr-code-link pending" id="qrLink${i+1}" target="_blank" rel="noopener noreferrer" aria-label="Открыть личный HUD игрока ${i+1}"><div id="qrCode${i+1}"></div></a><a class="qr-open" id="qrOpen${i+1}" target="_blank" rel="noopener noreferrer">ОТКРЫТЬ HUD ↗</a></article>`).join('')}</div><p class="qr-note">После разведки Светляком или Гипно пересканируйте свой обновлённый код. Ссылки содержат порядок карт — не пересылайте их сопернику.</p></section>`);$('#pagesBase').value=getPagesBase();$('#savePagesBase').onclick=()=>{const state=$('#pagesState');try{const base=normalizePagesBase($('#pagesBase').value);PAGES_BASE_OVERRIDE=base;try{localStorage.setItem(PAGES_BASE_KEY,base);}catch{};if(state)state.textContent='СОХРАНЕНО';renderQrPanel();}catch(error){if(state)state.textContent=error.message||'ПРОВЕРЬТЕ HTTPS-АДРЕС';}};}
function privateDeckUrl(id){if(!G.players[id]||G.players[id].slots.length!==6)return '';const base=getPagesBase();if(!base)return '';const url=new URL(base);url.search='';url.hash='';url.searchParams.set('p',String(id+1));url.searchParams.set('slots',G.players[id].slots.map((slot,index)=>`${index}-${slot.slug}`).join(','));const intel=G.players[opposite(id)]?.slots.flatMap((slot,index)=>slot.revealedTo.includes(id)?[`${index}-${slot.slug}`]:[])||[];if(intel.length)url.searchParams.set('r',intel.join(','));return url.toString();}
function renderQrPanel(){if(!$('#qrPanel'))return;const input=$('#pagesBase'),state=$('#pagesState'),automatic=detectedPagesBase(),base=getPagesBase();if(input){if(document.activeElement!==input||automatic)input.value=base;if(automatic){input.readOnly=true;$('#savePagesBase').hidden=true;if(state)state.textContent='АДРЕС ОПРЕДЕЛЁН';}else{input.readOnly=false;$('#savePagesBase').hidden=false;if(state&&state.textContent!=='СОХРАНЕНО')state.textContent=base?'СОХРАНЁН':'НУЖЕН HTTPS';}}for(let id=0;id<2;id++){const href=privateDeckUrl(id),code=$(`#qrCode${id+1}`),qrLink=$(`#qrLink${id+1}`),open=$(`#qrOpen${id+1}`),label=$(`#qrPlayer${id+1}`);if(label)label.textContent=`${G.names[id]||`ИГРОК ${id+1}`}`.toLocaleUpperCase('ru');if(!code||!qrLink||!open)continue;code.innerHTML='';if(href){qrLink.href=href;open.href=href;qrLink.classList.remove('pending');open.hidden=false;if(typeof QRCode==='function'){try{new QRCode(code,{text:href,width:112,height:112,colorDark:'#09131c',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}catch{qrLink.classList.add('pending');code.textContent='QR НЕ СОЗДАН';}}else{qrLink.classList.add('pending');code.textContent='БИБЛИОТЕКА QR НЕ ЗАГРУЗИЛАСЬ';}}else{qrLink.removeAttribute('href');open.removeAttribute('href');open.hidden=true;qrLink.classList.add('pending');code.textContent=base?'КАРТЫ РАУНДА ПЕРЕМЕШИВАЮТСЯ':'УКАЖИТЕ HTTPS-АДРЕС САЙТА';}}}
function privateCardMarkup(item){const slug=slugBy(item.slug);return `<article class="private-card" style="--slug:${slug.color}"><span class="private-index">СЛОТ 0${item.index+1}</span><button type="button" class="card-detail-image" data-card="${slug.id}" aria-label="Рассмотреть карту ${esc(slug.name)}"><img data-art src="${cardArt(slug)}" alt="${esc(slug.name)}" width="480" height="679" loading="lazy" decoding="async"></button><div class="private-caption"><strong>${slug.name}</strong><span>УВЕЛИЧИТЬ ↗</span></div></article>`;}
function renderPrivate(){const data=G.privateDeck;if(!data)return;if(data.error){app.innerHTML=`<main class="private-screen"><header class="private-head"><div class="brandline"><div class="brandmark">✦</div><div class="brandname">СЛАГТЕРРА <span>ДУЭЛИ</span></div></div><span class="eyebrow">ЛИЧНЫЙ HUD</span></header><section class="private-error"><h2>НЕ УДАЛОСЬ ОТКРЫТЬ КОЛОДУ</h2><p>${esc(data.error)} Попросите открыть QR-код снова на экране арены.</p></section></main>`;return;}const hidden=G.privateHidden;app.innerHTML=`<main class="private-screen"><header class="private-head"><div class="brandline"><div class="brandmark">✦</div><div class="brandname">СЛАГТЕРРА <span>ДУЭЛИ</span></div></div><span class="eyebrow">ЛИЧНЫЙ HUD</span></header><h1 class="private-title">ТВОЯ ТАЙНАЯ РАССТАНОВКА</h1><p class="private-subtitle">ИГРОК ${data.player+1} · Порядок слотов этого раунда</p>${hidden?`<section class="private-hidden"><div class="icon">◈</div><p>Колода скрыта на этом экране.</p><button class="primary private-reveal" id="revealPrivate">ПОКАЗАТЬ МОЮ КОЛОДУ</button></section>`:`<section class="private-grid">${data.slots.map(privateCardMarkup).join('')}</section>${data.intel.length?`<section class="private-intel"><h2>РАЗВЕДКА · КОЛОДА СОПЕРНИКА</h2><div class="private-grid">${data.intel.map(privateCardMarkup).join('')}</div></section>`:''}<button class="secondary private-hide" id="hidePrivate">СКРЫТЬ КОЛОДУ НА ЭКРАНЕ</button><p class="private-warning">Этот QR-код и ссылка содержат порядок карт. Держите их при себе; новую расстановку сканируйте в начале каждого раунда.</p>`}</main>`;bindCardDetails();$('#hidePrivate')?.addEventListener('click',()=>{G.privateHidden=true;renderPrivate();});$('#revealPrivate')?.addEventListener('click',()=>{G.privateHidden=false;renderPrivate();});}
function renderGame(){
 if(G.screen!=='game'&&G.screen!=='over')return;
 const viewer=null,initiativeWinner=G.initiative[0]===null?null:(G.initiative[0]>G.initiative[1]?0:1);
 app.innerHTML=`<main class="screen game"><header class="gamehead"><div class="game-head-left">${renderTop()}<span class="round-pill">РАУНД <b>${String(G.round).padStart(2,'0')}</b></span></div><div class="game-actions"><button class="iconbtn" id="showRules">ПРАВИЛА</button><button class="iconbtn" id="newDuel">НОВАЯ ДУЭЛЬ</button></div></header><div class="layout"><section class="arena">${duelistMarkup(1,viewer,'opponent')}<div class="turnbar"><div class="initiative"><span class="dice-mini">${G.initiative[0]??'–'}<small style="font-size:9px;color:#8294a7"> / </small>${G.initiative[1]??'–'}</span><span>ИНИЦИАТИВА<br><strong>${initiativeWinner===null?'ЖДЁМ БРОСКА':`${esc(playerName(initiativeWinner))} ХОДИТ ПЕРВЫМ`}</strong></span></div><div class="turn-msg"><small>${G.pending?'ВЫБОР ЦЕЛИ':'СОСТОЯНИЕ АРЕНЫ'}</small><strong>${esc(promptText())}</strong><p>${promptSub()}</p></div><div class="neutral ${G.neutralShield?'active':''}"><strong><span class="shield-glyph">⬡</span>${G.neutralShield?`ПОЛЕВОЙ ЩИТ · ${G.neutralShield}/3`:'ПОЛЕВОЙ ЩИТ · НЕТ'}</strong>${G.neutralShield?'Поглотит урон следующей атаки.':'Появляется при Гипно против Шилда.'}</div></div>${duelistMarkup(0,viewer,'you')}</section><aside class="sidepanel"><div class="loghead"><div><div class="logtitle">ЖУРНАЛ <span>БОЯ</span></div><div class="log-sub">БРОСКИ · ЭФФЕКТЫ · СЛАГИ</div></div><span class="log-count" id="logcount">${String(G.log.length).padStart(2,'0')}</span></div><div class="loglist" id="loglist"></div><div class="rulesnote">АТАКА · 1 — ПРОМАХ, 2–6 — ПОПАДАНИЕ<br>ЗАЩИТА · 1–4 — ПРОВАЛ, 5–6 — УСПЕХ</div></aside></div></main>`;
 syncLog();bindCardDetails();attachQrPanel();renderQrPanel();$('#showRules').onclick=showRules;$('#newDuel').onclick=()=>{if(confirm('Вернуться к выбору колоды? Текущая дуэль завершится.')){G=fresh();renderSetup();}};
 document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>onSlotClick(Number(b.dataset.owner),Number(b.dataset.slot)));

function showRules(){if($('#rulesLayer'))return;const layer=document.createElement('div');layer.className='rules-layer';layer.id='rulesLayer';layer.innerHTML=`<section class="rules-box"><header class="rules-top"><div><div class="eyebrow">ПАМЯТКА · ВЕРСИЯ 1</div><h2>ПРАВИЛА ДУЭЛИ И СЛАГИ</h2></div><button class="iconbtn" id="closeRules">ЗАКРЫТЬ ✕</button></header><p>У каждого игрока 20 ОЗ и шесть разных слагов. В начале раунда колода каждого игрока перемешивается отдельно и раскладывается по шести ячейкам. Обе колоды на общей арене закрыты; порядок своей колоды игрок смотрит по личному QR-коду. Инициатива — бросок d6, при равенстве переброс. Игроки ходят по очереди и активируют по одному слагу. На активации 1 — промах, ячейка тратится; 2–6 — успех. Раунд заканчивается, когда у обоих не осталось доступных ячеек, затем колоды перемешиваются заново. При 0 ОЗ игрок проигрывает.</p><div class="rules-section"><h3>Броски и длительность эффектов</h3><div class="rules-grid"><div class="rules-row"><b>Атака / активация:</b> d6: 1 — промах; 2–6 — попадание.</div><div class="rules-row"><b>Проверка защиты:</b> d6: 1–4 — эффект проходит; 5–6 — защита сработала.</div><div class="rules-row"><b>Ожог:</b> 1 урон в конце следующих двух ходов пострадавшего.</div><div class="rules-row"><b>Яд:</b> атаки пострадавшего наносят на 1 урон меньше в течение следующих двух его ходов (минимум 0).</div><div class="rules-row"><b>Регенерация:</b> +1 ОЗ в конце следующих двух ваших ходов, не выше 20 ОЗ.</div><div class="rules-row"><b>Щит:</b> личный щит на 3 ОЗ поглощает урон атак. Полевой щит поглощает до 3 урона следующей атаки любого игрока.</div><div class="rules-row"><b>Заморозка:</b> закрывает одну свободную ячейку до конца раунда.</div><div class="rules-row"><b>Конец раунда:</b> использованные и замороженные ячейки сбрасываются; оставшиеся ходы эффектов сохраняются.</div></div></div><div class="rules-section"><h3>Гипно · эффекты при провале проверки</h3><div class="rules-grid"><div class="rules-row"><b>Гипно:</b> «Психический удар» · 4 урона врагу.</div><div class="rules-row"><b>Док:</b> «Кража здоровья» · восстановить 3 ОЗ и снять Ожог / Яд.</div><div class="rules-row"><b>Шилд:</b> поставить полевой щит на 3 ОЗ; при броске 1–2 также нанести врагу 1 урон.</div><div class="rules-row"><b>Громобой:</b> ударить владельца на 4 урона.</div><div class="rules-row"><b>Огнеслаг:</b> 3 урона, затем проверка на Ожог.</div><div class="rules-row"><b>Токсин:</b> 2 урона, затем проверка на Яд.</div><div class="rules-row"><b>Ледоклык:</b> 1 урон, затем заморозить ячейку врага.</div><div class="rules-row"><b>Кислотник:</b> 5 урона, если у врага есть Ожог / Яд; иначе 2.</div><div class="rules-row"><b>Светляк:</b> 1 урон и раскрыть вам 2 ячейки врага.</div><div class="rules-row"><b>Бабах:</b> бросить d6; на 1 нанести 1 урон, иначе урон равен броску.</div><div class="rules-row"><b>Арахно:</b> 2 урона и дать себе Регенерацию на 2 хода.</div></div></div><div class="rules-section"><h3>Все 11 слагов</h3><div class="rules-grid">${SLUGS.map(s=>`<div class="rules-row"><b style="color:${s.color}">${s.name}:</b> ${s.desc}</div>`).join('')}</div></div></section>`;document.body.appendChild(layer);$('#closeRules').onclick=()=>layer.remove();layer.addEventListener('click',e=>{if(e.target===layer)layer.remove();});}
async function rollPopup(title,values,caption=''){G.busy=true;renderGame();const overlay=document.createElement('div');overlay.className='roll-layer';overlay.innerHTML=`<div class="rollbox"><small>СЛАГТЕРРА: ДУЭЛИ · D6</small><h2>${esc(title)}</h2><div class="dice-row">${values.map((v,i)=>`<div class="die rolling" id="die${i}">·</div>`).join('')}</div><div class="rolltext">${esc(caption||'Бросок кубика…')}</div></div>`;document.body.appendChild(overlay);await wait(title==='БРОСОК ИНИЦИАТИВЫ'?620:480);values.forEach((v,i)=>{const d=$(`#die${i}`);if(d){d.classList.remove('rolling');d.textContent=v;}});const t=overlay.querySelector('.rolltext');if(t)t.textContent=caption||`Выпало: ${values.join(' · ')}`;await wait(title==='БРОСОК ИНИЦИАТИВЫ'?540:340);overlay.remove();G.busy=false;return values;}
async function rollOne(title,detail){const v=rand();await rollPopup(title,[v],`${detail} · выпало ${v}`);log(`${esc(detail)}: выпало <b>${v}</b>.`,(v===1?'danger':v>=5?'success':''));return v;}
async function beginRound(){if(G.screen!=='game')return;G.round++;G.pending=null;G.active=null;G.initiative=[null,null];for(const p of G.players)p.slots=shuffle([...p.deck]).map(slug=>({slug,state:'down',revealedTo:[]}));log(`<b>Раунд ${G.round}</b> начался. Колоды перемешаны, ячейки закрыты.`,'note');renderGame();let a,b;do{a=rand();b=rand();G.initiative=[a,b];await rollPopup('БРОСОК ИНИЦИАТИВЫ',[a,b],`${playerName(0)}: ${a} · ${playerName(1)}: ${b}`);log(`Инициатива: <b>${esc(playerName(0))}</b> выбросил ${a}, <b>${esc(playerName(1))}</b> — ${b}.`,a===b?'note':'');if(a===b)log('Ничья. Повторный бросок инициативы.','note');}while(a===b&&G.screen==='game');if(G.screen!=='game')return;G.active=a>b?0:1;log(`<b>${esc(playerName(G.active))}</b> выиграл инициативу и ходит первым.`,'success');renderGame();}
function setGameOver(loserId){if(G.screen==='over')return;G.winner=opposite(loserId);G.screen='over';G.pending=null;G.busy=false;log(`<b>${esc(playerName(G.winner))}</b> побеждает в дуэли!`,'success');renderGame();}
function applyDamage(targetId,amount,source,{attack=false}={}){if(amount<=0){if(attack&&G.neutralShield>0){G.neutralShield=0;log('Полевой щит поглощает следующую атаку, но у неё не было урона. Щит исчезает.','note');}return 0;}const p=player(targetId);let left=amount,blocked=0;if(attack&&G.neutralShield>0){const n=Math.min(G.neutralShield,left);G.neutralShield-=n;left-=n;blocked+=n;log(`Полевой щит поглощает ${n} урона${G.neutralShield?` (осталось ${G.neutralShield})`:' и разрушается'}.`,'note');}if(attack&&p.effects.shield>0&&left>0){const n=Math.min(p.effects.shield,left);p.effects.shield-=n;left-=n;blocked+=n;log(`Личный щит игрока ${esc(p.name)} поглощает ${n} урона${p.effects.shield?` (осталось ${p.effects.shield} ОЗ)`:' и разрушается'}.`,'note');}p.hp=Math.max(0,p.hp-left);log(`<b>${esc(source)}</b> наносит ${left} урона игроку <b>${esc(p.name)}</b>${blocked?` (${blocked} поглощено щитами)`:''}.`,left?'danger':'note');if(p.hp<=0){setGameOver(targetId);return left;}return left;}
function heal(id,amount,source){const p=player(id),before=p.hp;p.hp=Math.min(20,p.hp+amount);const gained=p.hp-before;log(`${esc(source)} восстанавливает игроку ${esc(p.name)} <b>${gained} ОЗ</b> (${p.hp}/20).`,'success');}
function addStatus(id,key,duration,label){player(id).effects[key]=Math.max(player(id).effects[key],duration);log(`На игрока <b>${esc(playerName(id))}</b> наложен эффект «${label}» на ${ruTurns(duration)}.`,'danger');}
function attackAmount(id,base){return Math.max(0,base-(player(id).effects.poison?1:0));}
async function endTurn(id){if(G.screen!=='game')return;const p=player(id),e=p.effects;
 if(e.burn>0){log(`Ожог наносит игроку ${esc(p.name)} 1 урон в конце хода (осталось ${ruTurns(e.burn)}).`,'danger');applyDamage(id,1,'Ожог');e.burn--;if(G.screen==='over')return;if(!e.burn)log(`Ожог игрока ${esc(p.name)} проходит.`,'success');}
 if(e.regen>0){heal(id,1,'Регенерация');e.regen--;if(!e.regen)log(`Регенерация игрока ${esc(p.name)} заканчивается.`,'success');}
 if(e.poison>0){e.poison--;if(!e.poison)log(`Яд у игрока ${esc(p.name)} проходит.`,'success');}
 renderGame();const other=opposite(id);if(available(player(other)).length){G.active=other;G.pending=null;renderGame();return;}if(available(p).length){G.active=id;G.pending=null;renderGame();return;}G.active=null;renderGame();beginRound();
}
function setPending(kind,actorId,targetSide,extra={}){G.pending={kind,chooser:actorId,targetSide,...extra};renderGame();}
async function resolveHit(actorId,slug,index){const enemy=opposite(actorId),base=(n,src=slug.name)=>applyDamage(enemy,attackAmount(actorId,n),src,{attack:true});
 switch(slug.id){
  case'thunderbolt':base(4);await endTurn(actorId);return;
  case'frostfang':base(1);if(G.screen==='over')return;if(available(player(enemy)).length)setPending('frostTarget',actorId,enemy);else{log('Нет свободной ячейки врага для заморозки.','note');await endTurn(actorId);}return;
  case'flameslinger':base(3);if(G.screen==='over')return;{const save=await rollOne('ПРОВЕРКА ЗАЩИТЫ',`${playerName(enemy)} защищается от Ожога`);if(save<=4)addStatus(enemy,'burn',2,'Ожог');else log(`${esc(playerName(enemy))} отбил Ожог.`,'success');await endTurn(actorId);}return;
  case'toxin':base(2);if(G.screen==='over')return;{const save=await rollOne('ПРОВЕРКА ЗАЩИТЫ',`${playerName(enemy)} защищается от Яда`);if(save<=4)addStatus(enemy,'poison',2,'Яд');else log(`${esc(playerName(enemy))} отбился от Яда.`,'success');await endTurn(actorId);}return;
  case'lightwing':heal(actorId,3,'Док');if(player(actorId).effects.burn||player(actorId).effects.poison){player(actorId).effects.burn=0;player(actorId).effects.poison=0;log(`${esc(playerName(actorId))} снимает Ожог и Яд с помощью Дока.`,'success');}else log('Доку нечего снимать: Ожога и Яда нет.','note');await endTurn(actorId);return;
  case'mindspook':if(!available(player(enemy)).length){log('У врага нет свободной ячейки для Гипно.','note');await endTurn(actorId);}else setPending('mindspookTarget',actorId,enemy);return;
  case'lightbug':base(1);if(G.screen==='over')return;{const choices=available(player(enemy)).filter(i=>!player(enemy).slots[i].revealedTo.includes(actorId));const need=Math.min(2,choices.length);if(need)setPending('revealTwo',actorId,enemy,{needed:need,chosen:[]});else{log('Больше нет закрытых ячеек врага для разведки.','note');await endTurn(actorId);}}return;
  case'detonator':{const d=await rollOne('БРОСОК БАБАХА',`${playerName(actorId)} определяет силу нестабильной атаки`);if(d===1)applyDamage(actorId,1,'Осечка Бабаха',{attack:true});else applyDamage(enemy,attackAmount(actorId,d),'Бабах',{attack:true});await endTurn(actorId);return;}
  case'acidic':base((player(enemy).effects.burn||player(enemy).effects.poison)?5:2);await endTurn(actorId);return;
  case'vampire':base(2);if(G.screen==='over')return;addStatus(actorId,'regen',2,'Регенерация');await endTurn(actorId);return;
  default:await endTurn(actorId);
 }
}
async function resolveMindspook(actorId,targetIndex){const defender=opposite(actorId),slot=player(defender).slots[targetIndex],slug=slugBy(slot.slug);log(`${esc(playerName(actorId))} наводит Гипно на ячейку ${targetIndex+1}.`,'note');const save=await rollOne('ПРОВЕРКА РАЗУМА',`${playerName(defender)} сопротивляется Гипно`);if(save>=5){log(`${esc(playerName(defender))} сопротивляется. Ячейка остаётся закрытой и готовой к активации.`,'success');await endTurn(actorId);return;}slot.state='used';slot.revealedTo.push(actorId);log(`Гипно раскрывает слага <b>${slug.name}</b> и захватывает над ним контроль!`,'danger');renderGame();await triggerMindspook(actorId,defender,slug,save);}
async function triggerMindspook(actorId,defender,slug,primarySave){const hit=(amount,label=slug.name)=>applyDamage(defender,attackAmount(actorId,amount),label,{attack:true});switch(slug.id){
 case'mindspook':hit(4,'Психический удар');break;
 case'lightwing':heal(actorId,3,'Кража здоровья');player(actorId).effects.burn=0;player(actorId).effects.poison=0;log(`${esc(playerName(actorId))} снимает Ожог и Яд с помощью кражи здоровья.`,'success');break;
 case'stoneshield':if(primarySave<3)applyDamage(defender,attackAmount(actorId,1),'Ответный удар Шилда',{attack:true});else log('Шилд не наносит ответный урон: выпало 3 или больше.','note');if(G.screen!=='over'){G.neutralShield=3;log('Гипно ставит на поле <b>щит на 3 HP</b>.','note');}break;
 case'thunderbolt':hit(4);break;
 case'flameslinger':hit(3);if(G.screen!=='over'){const s=await rollOne('ПРОВЕРКА ЗАЩИТЫ',`${playerName(defender)} защищается от Ожога`);if(s<=4)addStatus(defender,'burn',2,'Ожог');else log(`${esc(playerName(defender))} отбил Ожог.`,'success');}break;
 case'toxin':hit(2);if(G.screen!=='over'){const s=await rollOne('ПРОВЕРКА ЗАЩИТЫ',`${playerName(defender)} защищается от Яда`);if(s<=4)addStatus(defender,'poison',2,'Яд');else log(`${esc(playerName(defender))} отбился от Яда.`,'success');}break;
 case'frostfang':hit(1);if(G.screen!=='over'){if(available(player(defender)).length)setPending('freezeSlot',actorId,defender,{finishActor:actorId});else log('Ледоклыку некого заморозить: свободных ячеек нет.','note');}break;
 case'acidic':hit((player(actorId).effects.burn||player(actorId).effects.poison)?5:2);break;
 case'lightbug':hit(1);if(G.screen!=='over'){const choices=available(player(defender)).filter(i=>!player(defender).slots[i].revealedTo.includes(actorId));const need=Math.min(2,choices.length);if(need)setPending('revealTwo',actorId,defender,{needed:need,chosen:[],finishActor:actorId});}break;
 case'detonator':{const d=await rollOne('БРОСОК БАБАХА',`${playerName(actorId)} управляет слагом Бабах`);applyDamage(defender,attackAmount(actorId,d===1?1:d),'Бабах под контролем Гипно',{attack:true});break;}
 case'vampire':hit(2);addStatus(actorId,'regen',2,'Регенерация');break;
 }
 if(G.screen==='over')return;if(G.pending){G.pending.finishActor=actorId;renderGame();return;}await endTurn(actorId);
}
async function onSlotClick(owner,index){if(G.busy||G.screen!=='game')return;const p=player(owner),slot=p.slots[index];if(!slot)return;
 if(G.pending){if(!slotIsSelectable(owner,index))return;const pending=G.pending;
  if(pending.kind==='mindspookTarget'){G.pending=null;G.busy=true;renderGame();await resolveMindspook(pending.chooser,index);return;}
  if(pending.kind==='frostTarget'){G.pending=null;G.busy=true;renderGame();log(`${esc(playerName(pending.chooser))} выбирает ячейку ${index+1} для заморозки.`,'note');const save=await rollOne('ПРОВЕРКА ЗАЩИТЫ',`${playerName(owner)} защищает ячейку от заморозки`);if(save<=4){slot.state='frozen';log(`Ячейка ${index+1} <b>заморожена</b> до конца раунда.`,'danger');}else log(`${esc(playerName(owner))} защитил ячейку от заморозки.`,'success');await endTurn(pending.chooser);return;}
  if(pending.kind==='freezeSlot'){G.pending=null;slot.state='frozen';log(`Ячейка ${index+1} игрока ${esc(playerName(owner))} <b>заморожена</b> до конца раунда.`,'danger');if(pending.finishActor!==undefined)await endTurn(pending.finishActor);else await endTurn(pending.chooser);return;}
  if(pending.kind==='revealTwo'){slot.revealedTo.push(pending.chooser);pending.chosen.push(index);log(`Светляк раскрыл ячейку ${index+1} игроку ${esc(playerName(pending.chooser))}.`,'note');if(pending.chosen.length>=pending.needed){G.pending=null;renderGame();await endTurn(pending.chooser);}else{G.pending=pending;renderGame();}return;}
  return;
 }
 if(owner!==G.active||slot.state!=='down')return;const actor=owner,slug=slugBy(slot.slug);G.busy=true;renderGame();const roll=await rollOne('БРОСОК АКТИВАЦИИ',`${playerName(actor)} активирует слага ${slug.name}`);slot.state='used';renderGame();if(roll===1){log(`<b>${slug.name}</b> промахивается. Ячейка ${index+1} потрачена.`,'danger');await endTurn(actor);return;}log(`<b>${slug.name}</b> попадает (выпало ${roll}).`,'success');if(slug.id==='stoneshield'){player(actor).effects.shield=3;log(`${esc(playerName(actor))} получает <b>личный щит на 3 HP</b>.`,'success');const enemy=opposite(actor),save=await rollOne('ПРОВЕРКА ЩИТА',`${playerName(enemy)} защищается от ответного удара Шилда`);if(save<3)applyDamage(enemy,attackAmount(actor,1),'Ответный удар Шилда',{attack:true});else log(`${esc(playerName(enemy))} избегает ответного удара Шилда.`,'success');await endTurn(actor);return;}await resolveHit(actor,slug,index);
}
function showGameOver(){if($('#gameover'))return;const w=player(G.winner);const layer=document.createElement('div');layer.className='result-layer';layer.id='gameover';layer.innerHTML=`<div class="result-card"><div class="cup">✦</div><small>ДУЭЛЬ ЗАВЕРШЕНА · РАУНД ${String(G.round).padStart(2,'0')}</small><h2>${esc(w.name)}<br>ПОБЕДИЛ!</h2><p>У игрока ${esc(player(opposite(G.winner)).name)} закончилось здоровье. Арена достаётся игроку ${esc(w.name)}.</p><button class="primary" id="rematch">РЕВАНШ С ТЕМИ ЖЕ КОЛОДАМИ</button><button class="secondary" id="backToBuild">СОБРАТЬ НОВЫЕ КОЛОДЫ</button></div>`;document.body.appendChild(layer);$('#rematch').onclick=()=>{layer.remove();G.players.forEach(p=>{p.hp=20;p.effects={burn:0,poison:0,regen:0,shield:0};});G.round=0;G.screen='game';G.winner=null;G.log=[];G.neutralShield=0;log('Начинается реванш. Оба игрока восстановлены до 20 ОЗ.','note');renderGame();beginRound();};$('#backToBuild').onclick=()=>{layer.remove();G=fresh();renderSetup();};}
const privateRequest=readPrivateRequest();if(privateRequest){G.screen='private';G.privateDeck=privateRequest;renderPrivate();}else renderSetup();
})();
</script>
